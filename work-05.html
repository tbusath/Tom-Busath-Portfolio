  async function decrypt(pw){
    var raw=Uint8Array.from(atob(PAYLOAD),function(c){return c.charCodeAt(0);});
    var salt=raw.slice(0,16), iv=raw.slice(16,28), ct=raw.slice(28);
    var km=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
    var key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:salt,iterations:ITER,hash:"SHA-256"},km,{name:"AES-GCM",length:256},false,["decrypt"]);
    var pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:iv},key,ct);
    return new TextDecoder().decode(pt);
  }
  async function tryUnlock(pw, remember){
    try{
      var html=await decrypt(pw);
      if(remember){ try{ sessionStorage.setItem("tb_pw", pw); }catch(e){} }
      document.open(); document.write(html); document.close();
    }catch(e){
      document.getElementById("err").textContent="Incorrect password.";
      try{ sessionStorage.removeItem("tb_pw"); }catch(_){}
    }
  }
  document.getElementById("f").addEventListener("submit",function(ev){
    ev.preventDefault(); tryUnlock(document.getElementById("pw").value, true);
  });
  var saved=null; try{ saved=sessionStorage.getItem("tb_pw"); }catch(e){}
  if(saved){ tryUnlock(saved, false); }
